# fdroidserver configuration. No secrets here: the publish workflow writes
# the repo signing keystore from the FDROID_KEYSTORE secret and passes the
# passwords as environment variables.

repo_url: https://twohardthings.github.io/fdroid/repo
repo_name: Two Hard Things
repo_description: >-
  Apps by Two Hard Things. Every app is built and signed in its own GitHub
  repository; this repo only republishes those signed release APKs after
  checking their checksums and signing certificates.

# Only the newest releases are kept (see keep_releases in apps.yml), so
# there is no archive.
archive_older: 0

keystore: keystore.p12
repo_keyalias: repo
keystorepass:
  env: FDROID_KEYSTORE_PASS
keypass:
  env: FDROID_KEYSTORE_PASS
